services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: actes
      POSTGRES_PASSWORD: actes
      POSTGRES_DB: actes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actes"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://actes:actes@db:5432/actes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://actes:actes@db:5432/actes
    command: ["python", "-m", "app.workers.sync_worker"]
    depends_on:
      api:
        condition: service_started

  web:
    build: .
    env_file: .env
    environment:
      WEB_API_URL: http://api:8000/api/v1
      WEB_SESSIONS_DIR: /tmp/sessions
    command: ["flask", "--app", "web.app", "run", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
